services:
  json-editor:
    platform: linux/amd64
    container_name: json-editor
    image: programus/json-editor:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    # The image is a single static binary plus read-only assets, so it needs no
    # writable layer and no privileges at all.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
